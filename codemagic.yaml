workflows:
  android-release:
    name: Android Release
    max_build_duration: 20
    environment:
      java: 17
    scripts:
      - name: Generar wrapper de Gradle
        script: gradle wrapper --gradle-version 8.9
      - name: Compilar APK
        script: ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/**/*.apk